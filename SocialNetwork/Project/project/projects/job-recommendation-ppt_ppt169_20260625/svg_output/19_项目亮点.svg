<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#1B5E20">项目亮点与成果</text>
    <text x="60" y="88" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#81C784" letter-spacing="4">PROJECT HIGHLIGHTS</text>
  </g>

  <!-- 2x2 Highlight Cards -->
  <g id="highlights" transform="translate(60, 140)">
    <!-- Card 1: Complete Demo Loop -->
    <g transform="translate(0, 0)">
      <rect width="560" height="230" rx="16" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <g transform="translate(28, 28)">
        <use data-icon="tabler-outline/check" x="0" y="0" width="40" height="40" fill="#2E7D32" stroke-width="2"/>
        <text x="60" y="30" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">完整演示闭环</text>
        <text x="0" y="65" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">注册登录 → 知识图谱 → 推荐 → 时间线</text>
        <text x="0" y="97" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">→ 问答 → 简历分析，全流程本地可运行</text>
      </g>
    </g>

    <!-- Card 2: Explainable Recommendation -->
    <g transform="translate(600, 0)">
      <rect width="560" height="230" rx="16" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <g transform="translate(28, 28)">
        <use data-icon="tabler-outline/search" x="0" y="0" width="40" height="40" fill="#2E7D32" stroke-width="2"/>
        <text x="60" y="30" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">可解释推荐</text>
        <text x="0" y="65" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">基于图谱匹配而非黑盒模型</text>
        <text x="0" y="97" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">推荐结果可追溯、可解释，每个推荐都有关系依据</text>
      </g>
    </g>

    <!-- Card 3: AI-Enhanced -->
    <g transform="translate(0, 260)">
      <rect width="560" height="230" rx="16" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <g transform="translate(28, 28)">
        <use data-icon="tabler-outline/brain" x="0" y="0" width="40" height="40" fill="#2E7D32" stroke-width="2"/>
        <text x="60" y="30" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">AI增强分析</text>
        <text x="0" y="65" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">大语言模型补充传统图谱查询不足</text>
        <text x="0" y="97" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">AI生成职业发展解释、问答和简历分析建议</text>
      </g>
    </g>

    <!-- Card 4: Multi-dimensional Visualization -->
    <g transform="translate(600, 260)">
      <rect width="560" height="230" rx="16" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <g transform="translate(28, 28)">
        <use data-icon="tabler-outline/chart-bar" x="0" y="0" width="40" height="40" fill="#2E7D32" stroke-width="2"/>
        <text x="60" y="30" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">多维度可视化</text>
        <text x="0" y="65" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">ECharts力导向图 + Element Plus表格/</text>
        <text x="0" y="97" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">时间线/卡片，多组件协同呈现数据洞察</text>
      </g>
    </g>
  </g>

  <!-- Footer: thank you -->
  <text x="640" y="690" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#999999">谢谢！Thank You</text>
  <text x="120" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#999999">19</text>
</svg>