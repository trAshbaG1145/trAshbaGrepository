<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentBar)"/>

  <!-- Header -->
  <g id="header">
    <text x="640" y="80" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#1B5E20">
      目 录
    </text>
    <text x="640" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#81C784" letter-spacing="6">
      CONTENTS
    </text>
    <rect x="540" y="135" width="200" height="2" rx="1" fill="#C8E6C9"/>
  </g>

  <!-- TOC Quadrants -->
  <g id="toc-grid" transform="translate(80, 175)">

    <!-- Part 1 -->
    <g id="toc-p1" transform="translate(0, 0)">
      <rect width="530" height="225" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <!-- Number badge -->
      <circle cx="50" cy="50" r="28" fill="#2E7D32"/>
      <text x="50" y="57" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="bold" fill="#FFFFFF">01</text>
      <text x="100" y="45" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">
        项目概述与技术架构
      </text>
      <text x="100" y="75" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">
        系统定位 · 团队分工 · 整体架构 · 技术栈 · 数据与图谱
      </text>
      <!-- Items list -->
      <g transform="translate(100, 105)">
        <circle cx="6" cy="-4" r="4" fill="#81C784"/>
        <text x="20" y="0" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">系统定位与团队分工</text>
        <circle cx="6" cy="30" r="4" fill="#81C784"/>
        <text x="20" y="34" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">整体架构 · 技术栈 · 数据与图谱建模</text>
      </g>
    </g>

    <!-- Part 2 -->
    <g id="toc-p2" transform="translate(590, 0)">
      <rect width="530" height="225" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <circle cx="50" cy="50" r="28" fill="#2E7D32"/>
      <text x="50" y="57" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="bold" fill="#FFFFFF">02</text>
      <text x="100" y="45" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">
        核心功能演示
      </text>
      <text x="100" y="75" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">
        系统入口 · 知识图谱 · 推荐 · 时间线 · AI问答 · 简历分析
      </text>
      <g transform="translate(100, 105)">
        <circle cx="6" cy="-4" r="4" fill="#81C784"/>
        <text x="20" y="0" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">登录与主界面 · 知识图谱可视化</text>
        <circle cx="6" cy="30" r="4" fill="#81C784"/>
        <text x="20" y="34" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">职业推荐 · 时间线 · AI问答 · 简历分析</text>
      </g>
    </g>

    <!-- Part 3 -->
    <g id="toc-p3" transform="translate(0, 260)">
      <rect width="530" height="225" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <circle cx="50" cy="50" r="28" fill="#2E7D32"/>
      <text x="50" y="57" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="bold" fill="#FFFFFF">03</text>
      <text x="100" y="45" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">
        推荐算法与大模型
      </text>
      <text x="100" y="75" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">
        推荐流程 · 匹配评分 · 大语言模型集成
      </text>
      <g transform="translate(100, 105)">
        <circle cx="6" cy="-4" r="4" fill="#81C784"/>
        <text x="20" y="0" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">五步推荐算法流程与匹配评分权重</text>
        <circle cx="6" cy="30" r="4" fill="#81C784"/>
        <text x="20" y="34" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">DeepSeek-V3大模型集成方案</text>
      </g>
    </g>

    <!-- Part 4 -->
    <g id="toc-p4" transform="translate(590, 260)">
      <rect width="530" height="225" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <circle cx="50" cy="50" r="28" fill="#2E7D32"/>
      <text x="50" y="57" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="28" font-weight="bold" fill="#FFFFFF">04</text>
      <text x="100" y="45" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1B5E20">
        总结
      </text>
      <text x="100" y="75" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">
        项目亮点与成果
      </text>
      <g transform="translate(100, 105)">
        <circle cx="6" cy="-4" r="4" fill="#81C784"/>
        <text x="20" y="0" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">完整演示闭环 · 可解释推荐</text>
        <circle cx="6" cy="30" r="4" fill="#81C784"/>
        <text x="20" y="34" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333">AI增强分析 · 多维度可视化</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="1220" y="700" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#999999">
    02
  </text>
</svg>