<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#1B5E20">数据源与知识图谱建模</text>
    <text x="60" y="95" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#81C784" letter-spacing="4">DATA SOURCE &amp; KNOWLEDGE GRAPH MODELING</text>
    <rect x="60" y="108" width="80" height="3" rx="2" fill="#2E7D32"/>
  </g>

  <!-- Key numbers row -->
  <g id="key-numbers" transform="translate(60, 145)">
    <g transform="translate(0, 0)">
      <rect width="270" height="100" rx="14" fill="#E8F5E9"/>
      <text x="135" y="42" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#2E7D32">803</text>
      <text x="135" y="78" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">岗位数据记录</text>
    </g>
    <g transform="translate(295, 0)">
      <rect width="270" height="100" rx="14" fill="#E8F5E9"/>
      <text x="135" y="42" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#2E7D32">6</text>
      <text x="135" y="78" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">实体节点类型</text>
    </g>
    <g transform="translate(590, 0)">
      <rect width="270" height="100" rx="14" fill="#E8F5E9"/>
      <text x="135" y="42" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#2E7D32">5</text>
      <text x="135" y="78" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">关系类型</text>
    </g>
    <g transform="translate(885, 0)">
      <rect width="270" height="100" rx="14" fill="#E8F5E9"/>
      <text x="135" y="42" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#2E7D32">10+</text>
      <text x="135" y="78" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">数据字段</text>
    </g>
  </g>

  <!-- Data source info -->
  <g id="data-source" transform="translate(60, 275)">
    <rect width="1160" height="80" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
    <text x="30" y="34" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1B5E20">数据来源</text>
    <text x="30" y="66" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">项目内置招聘岗位样本数据，共803条记录。字段：职位、城市、公司、学历、经验、技能、薪资、福利、工作描述、行业。</text>
  </g>

  <!-- Entity-Relationship section -->
  <g id="er-diagram" transform="translate(60, 380)">
    <!-- Entities row -->
    <text x="0" y="-10" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1B5E20">图谱实体与关系</text>

    <!-- Entity nodes -->
    <g transform="translate(0, 30)">
      <rect width="165" height="52" rx="26" fill="#2E7D32"/>
      <text x="82" y="34" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Job 岗位</text>
    </g>
    <g transform="translate(190, 30)">
      <rect width="185" height="52" rx="26" fill="#81C784"/>
      <text x="92" y="34" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Company 公司</text>
    </g>
    <g transform="translate(400, 30)">
      <rect width="155" height="52" rx="26" fill="#81C784"/>
      <text x="77" y="34" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">City 城市</text>
    </g>
    <g transform="translate(580, 30)">
      <rect width="155" height="52" rx="26" fill="#81C784"/>
      <text x="77" y="34" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Skill 技能</text>
    </g>
    <g transform="translate(760, 30)">
      <rect width="180" height="52" rx="26" fill="#81C784"/>
      <text x="90" y="34" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Degree 学历</text>
    </g>
    <g transform="translate(965, 30)">
      <rect width="195" height="52" rx="26" fill="#81C784"/>
      <text x="97" y="34" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Experience 经验</text>
    </g>

    <!-- Relations -->
    <text x="0" y="130" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#666666">关系：</text>
    <g transform="translate(80, 110)">
      <rect width="200" height="36" rx="18" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <text x="100" y="25" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#333333">REQUIRES（需要）</text>
    </g>
    <g transform="translate(300, 110)">
      <rect width="220" height="36" rx="18" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <text x="110" y="25" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#333333">BELONGS_TO（属于）</text>
    </g>
    <g transform="translate(540, 110)">
      <rect width="230" height="36" rx="18" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <text x="115" y="25" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#333333">LOCATED_IN（位于）</text>
    </g>
  </g>

  <text x="1220" y="700" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#999999">07</text>
</svg>