<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="48" font-weight="bold" fill="#1B5E20">技术栈总览</text>
    <text x="60" y="95" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#81C784" letter-spacing="4">TECHNOLOGY STACK</text>
    <rect x="60" y="108" width="80" height="3" rx="2" fill="#2E7D32"/>
  </g>

  <!-- Three columns -->
  <g id="tech-stack" transform="translate(60, 155)">

    <!-- Frontend -->
    <g id="col-frontend">
      <rect width="370" height="490" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <rect width="370" height="80" rx="14" fill="#2E7D32"/>
      <rect y="66" width="370" height="14" fill="#2E7D32"/>
      <use data-icon="tabler-outline/code" x="30" y="20" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="90" y="49" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">前端技术</text>

      <g transform="translate(24, 105)">
        <rect width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="32" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">Vue 3</tspan> — 渐进式前端框架</text>
        <rect y="60" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="92" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">Element Plus</tspan> — UI组件库</text>
        <rect y="120" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="152" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">ECharts 5</tspan> — 数据可视化图表</text>
        <rect y="180" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">Axios</tspan> — HTTP客户端</text>
        <rect y="240" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="272" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">Pinia</tspan> · Vue Router · Vite</text>
        <rect y="300" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">marked</tspan> · mammoth · jwt-decode</text>
      </g>
    </g>

    <!-- Backend -->
    <g id="col-backend" transform="translate(395, 0)">
      <rect width="370" height="490" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <rect width="370" height="80" rx="14" fill="#1B5E20"/>
      <rect y="66" width="370" height="14" fill="#1B5E20"/>
      <use data-icon="tabler-outline/server" x="30" y="20" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="90" y="49" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">后端技术</text>

      <g transform="translate(24, 105)">
        <rect width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="32" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#1B5E20">Spring Boot 3.4</tspan> — Java业务后端</text>
        <rect y="60" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="92" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#1B5E20">MyBatis-Plus 3.5</tspan> — ORM框架</text>
        <rect y="120" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="152" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#1B5E20">JWT + Argon2</tspan> — 认证与密码哈希</text>
        <rect y="180" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#1B5E20">MySQL 8.0</tspan> — 关系型数据库</text>
        <rect y="240" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="272" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#1B5E20">Druid</tspan> — 数据库连接池</text>
        <rect y="300" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#1B5E20">Redis</tspan> · Jedis — 缓存支持</text>
      </g>
    </g>

    <!-- AI & Data -->
    <g id="col-ai" transform="translate(790, 0)">
      <rect width="370" height="490" rx="14" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
      <rect width="370" height="80" rx="14" fill="#81C784"/>
      <rect y="66" width="370" height="14" fill="#81C784"/>
      <use data-icon="tabler-outline/brain" x="30" y="20" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="90" y="49" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">AI与数据</text>

      <g transform="translate(24, 105)">
        <rect width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="32" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">Flask</tspan> — AI微服务框架</text>
        <rect y="60" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="92" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">Neo4j</tspan> — 图数据库</text>
        <rect y="120" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="152" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">SiliconFlow API</tspan> — 大模型调用</text>
        <rect y="180" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">py2neo</tspan> — Neo4j Python驱动</text>
        <rect y="240" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="272" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">PyMuPDF</tspan> · python-docx — 文档解析</text>
        <rect y="300" width="322" height="50" rx="10" fill="#FFFFFF"/>
        <text x="16" y="332" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#333333"><tspan font-weight="bold" fill="#2E7D32">pandas</tspan> · pytesseract · Pillow</text>
      </g>
    </g>
  </g>

  <text x="1220" y="700" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#999999">06</text>
</svg>